<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Rinten">
  <!-- The Linux application icon. -->
  <!--
    The rotor of brand/rotor.svg, filling the icon, on nothing. Painted in
    #FFFFFF, so a desktop that paints its own icons a colour has something to
    recolour and one that does not gets the mark as it is drawn everywhere else.
  -->
  <defs>
    <mask id="rotor" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>

      <!-- side-seal groove: the profile itself, scaled about the axis -->
      <path d="M100 16.67A233.33 233.33 0 0 1 186.6 166.67A233.33 233.33 0 0 1 13.4 166.67A233.33 233.33 0 0 1 100 16.67Z" fill="none" stroke="#000" stroke-width="3.38"
            transform="translate(100 116.67) scale(0.888) translate(-100 -116.67)"/>

      <!-- oil-seal ring -->
      <circle cx="100" cy="116.67" r="50" fill="none"
              stroke="#000" stroke-width="4"/>

      <!-- apex-seal slots -->
      <rect x="95.5" y="10.67" width="9" height="32" rx="4.5" fill="#000" transform="rotate(0 100 116.67)"/>
      <rect x="95.5" y="10.67" width="9" height="32" rx="4.5" fill="#000" transform="rotate(120 100 116.67)"/>
      <rect x="95.5" y="10.67" width="9" height="32" rx="4.5" fill="#000" transform="rotate(240 100 116.67)"/>

      <!-- bearing bore, then the phasing-gear teeth put material back -->
      <circle cx="100" cy="116.67" r="30" fill="#000"/>
      <g fill="#fff">
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(0 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(25.71 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(51.43 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(77.14 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(102.86 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(128.57 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(154.29 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(180 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(205.71 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(231.43 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(257.14 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(282.86 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(308.57 100 116.67)"/>
        <rect x="95.5" y="86.67" width="9" height="5" transform="rotate(334.29 100 116.67)"/>
      </g>
    </mask>
  </defs>

  <!-- mark: 0.92 of the icon across, its bounding box centred on it -->
  <g transform="translate(100 100) scale(1.062) translate(-100.029 -101.789)" fill="#FFFFFF">
    <path mask="url(#rotor)" d="M100 16.67A233.33 233.33 0 0 1 186.6 166.67A233.33 233.33 0 0 1 13.4 166.67A233.33 233.33 0 0 1 100 16.67Z"/>
  </g>
</svg>
