name: Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: [ windows-latest ]
    steps:
      - name: Full Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Managed only. The native core is built by core.yml, for every platform and as an
      # artifact; the tests here run against the rintencore that is in game/bin already.
      - name: Build
        run: dotnet run --project .\engine\Tools\RintenBuild\RintenBuild.csproj -- build --skip-native

      - name: Test
        run: dotnet run --project .\engine\Tools\RintenBuild\RintenBuild.csproj -- test --filter "TestCategory!=LiveBackend"
