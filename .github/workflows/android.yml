name: android

# Builds an apk: the core for arm64, the managed engine, and the head project that puts a game inside an Android package. The point of it being here rather than on a machine: an Android build needs the NDK, the SDK, a JDK and the net10.0-android workload, and none of those are things somebody making games should have to install to find
# out whether their game runs on a phone. The runner has the SDK and the JDK already; this adds the other two, and what comes out is an apk on the run's page. engine/Core is a private repository checked out inside this one, so this needs the repository variable CORE_REPO and the secret CORE_TOKEN - without them the job says so and stops.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'engine/Launcher/RintenAndroid/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the core
        id: core
        uses: ./.github/actions/checkout-core
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_TOKEN }}

      - uses: nttld/setup-ndk@v1
        if: steps.core.outputs.present == 'true'
        id: ndk
        with:
          ndk-version: r27

      # arm64 only. A 32-bit phone will not run this engine, and every device Vulkan is worth having on has been arm64 for years. The script rather than the commands: it
      # had them written out here as well, and only the script strips the library before it goes in the apk - twenty-two megabytes of debug info that every player downloads.
      - name: Build the core
        if: steps.core.outputs.present == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ./engine/Core/build-android.sh

      - uses: actions/setup-dotnet@v4
        if: steps.core.outputs.present == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        if: steps.core.outputs.present == 'true'
        run: dotnet workload install android

      # Third-party libraries the checkout does not carry
      - name: Fetch what the engine is built against
        if: steps.core.outputs.present == 'true'
        run: |
          dotnet run --project engine/Tools/RintenBuild/RintenBuild.csproj -- fetch-natives || true

      - name: Build the managed engine
        if: steps.core.outputs.present == 'true'
        run: dotnet build -c Release engine/Rinten-Engine.slnx

      # The game inside the package. Everything under game/ that is content rather than
      # platform: bin/ holds one build of the core per platform and the apk carries its own.
      - name: Pack the payload
        if: steps.core.outputs.present == 'true'
        run: |
          cd game
          zip -qr ../engine/Launcher/RintenAndroid/payload.zip . -x 'bin/*' './bin/*' '.building'
          cd ..
          ls -lh engine/Launcher/RintenAndroid/payload.zip

      - name: Build the apk
        if: steps.core.outputs.present == 'true'
        run: |
          dotnet build engine/Launcher/RintenAndroid/Rinten-Android.csproj \
            -c Release -f net10.0-android

      - uses: actions/upload-artifact@v4
        if: steps.core.outputs.present == 'true'
        with:
          name: rinten-android-arm64
          path: |
            engine/Launcher/RintenAndroid/bin/Release/net10.0-android/*Signed.apk
            engine/Launcher/RintenAndroid/bin/Release/net10.0-android/*.apk
